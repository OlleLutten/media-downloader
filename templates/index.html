<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Downloader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="logo">↓</div>
    <div>
      <h1>Media Downloader</h1>
      <p>yt-dlp + svtplay-dl</p>
    </div>
  </section>

  <section class="card">
    <label for="url">URL</label>
    <input id="url" type="url" placeholder="https://www.svtplay.se/... eller https://youtube.com/..." autofocus>

    <div class="grid">
      <div>
        <label for="downloader">Downloader</label>
        <select id="downloader">
          <option value="auto">Auto</option>
          <option value="yt-dlp">yt-dlp</option>
          <option value="svtplay-dl">svtplay-dl</option>
        </select>
      </div>
      <div>
        <label for="quality">Kvalitet</label>
        <select id="quality">
          <option value="best">Bästa möjliga</option>
          <option value="1080">Max 1080p</option>
          <option value="720">Max 720p</option>
          <option value="480">Max 480p</option>
          <option value="360">Max 360p</option>
        </select>
      </div>
    </div>

    <label class="check"><input id="subs" type="checkbox"> Ladda ner undertexter</label>
    <button id="start">Ladda ner</button>
    <div id="error"></div>
  </section>

  <section class="card">
    <h2>Pågående</h2>
    <div id="jobs" class="empty">Inga pågående nedladdningar.</div>
  </section>

  <section class="card">
    <h2>Nedladdade filer</h2>
    <div id="files" class="empty">Laddar…</div>
  </section>
</main>

<script>
const jobs = new Map();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function startDownload() {
  const url = document.querySelector('#url').value.trim();
  const error = document.querySelector('#error');
  error.textContent = '';
  if (!url) { error.textContent = 'Klistra in en URL först.'; return; }

  const res = await fetch('/api/download', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      url,
      downloader: document.querySelector('#downloader').value,
      quality: document.querySelector('#quality').value,
      subtitles: document.querySelector('#subs').checked
    })
  });
  const data = await res.json();
  if (!res.ok) { error.textContent = data.error || 'Något gick fel.'; return; }

  jobs.set(data.id, data);
  document.querySelector('#url').value = '';
  renderJobs();
}

async function poll() {
  for (const [id] of jobs) {
    const res = await fetch('/api/jobs/' + id);
    if (res.ok) jobs.set(id, await res.json());
  }
  renderJobs();
  loadFiles();
}

function renderJobs() {
  const el = document.querySelector('#jobs');
  if (!jobs.size) { el.className='empty'; el.textContent='Inga pågående nedladdningar.'; return; }
  el.className='';
  el.innerHTML = [...jobs.values()].reverse().map(j => `
    <div class="job">
      <div class="jobtop"><strong>${esc(j.downloader)}</strong><span>${esc(j.status)}</span></div>
      <div class="url">${esc(j.url)}</div>
      <div class="bar"><i style="width:${j.progress || 0}%"></i></div>
      <small>${Math.round(j.progress || 0)}% — ${esc(j.message || '')}</small>
    </div>`).join('');
}

async function loadFiles() {
  const res = await fetch('/api/files');
  const files = await res.json();
  const el = document.querySelector('#files');
  if (!files.length) { el.className='empty'; el.textContent='Inga filer ännu.'; return; }
  el.className='';
  el.innerHTML = files.map(f => `
    <div class="file"><a href="/download/${encodeURIComponent(f.name)}">${esc(f.name)}</a>
    <span>${(f.size/1024/1024).toFixed(1)} MB</span></div>`).join('');
}

document.querySelector('#start').addEventListener('click', startDownload);
document.querySelector('#url').addEventListener('keydown', e => { if (e.key === 'Enter') startDownload(); });
loadFiles();
setInterval(poll, 1500);
</script>
</body>
</html>
